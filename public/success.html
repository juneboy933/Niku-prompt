<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Payment Success</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Helvetica, Arial, sans-serif;
        background: linear-gradient(160deg, #0f766e 0%, #115e59 55%, #134e4a 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        color: #1f2937;
      }
      .card {
        width: 100%;
        max-width: 400px;
        background: #ffffff;
        border-radius: 18px;
        box-shadow: 0 24px 48px rgba(0, 0, 0, 0.25);
        padding: 40px 28px;
        text-align: center;
      }
      .icon {
        font-size: 52px;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 22px;
        color: #047857;
        margin-bottom: 10px;
      }
      p {
        font-size: 14px;
        color: #6b7280;
        line-height: 1.6;
      }
      .btn {
        display: block;
        margin-top: 24px;
        background: #dc2626;
        color: #ffffff;
        text-decoration: none;
        font-weight: 700;
        padding: 14px;
        border-radius: 10px;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">&#10004;</div>
      <h1>Payment Successful</h1>
      <p>
        Your payment prompt has been sent. Once you complete the M-Pesa prompt
        your receipt will be available.
      </p>
      <a class="btn" href="/">Make another payment</a>
    </div>
  </body>
</html>
